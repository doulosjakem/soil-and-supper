    classes:
      - Aphid
      - Japanese_beetle
      - Colorado_potato_beetle
      - Cucumber_beetle
      - Cabbage_worm
      - Tomato_hornworm
      - Squash_bug
      - Whitefly
      - Spider_mite
      - Thrips
      - Leafminer
      - Cutworm
      - Stink_bug
      - Flea_beetle
      - Mexican_bean_beetle
      - Corn_earworm
      - Squash_vine_borer
      - Blister_beetle
      - Ladybug
      - Green_lacewing
      - Honey_bee
      - Hoverfly
      - Praying_mantis
      - Spider
      - Earthworm
      - Other_pest

  diseases:
    enabled: true
    classes:
      - Healthy
      - Powdery_mildew
      - Downy_mildew
      - Early_blight
      - Late_blight
      - Septoria_leaf_spot
      - Bacterial_spot
      - Fusarium_wilt
      - Verticillium_wilt
      - Anthracnose
      - Rust
      - Leaf_spot
      - Blossom_end_rot
      - Nutrient_deficiency
      - Sunscald
      - Frost_damage
      - Hail_damage
      - Overwatering_stress
      - Underwatering_stress
      - Insect_damage
      - Chewing_damage
      - Leaf_miner_damage
      - Apple_scab
      - Cedar_apple_rust
      - Grape_black_rot
      - Peach_bacterial_spot
      - Soybean_rust
      - Squash_powdery_mildew
      - Tomato_mosaic_virus
      - Tomato_yellow_leaf_curl

  growth_stages:
    enabled: true
    classes:
      - Seedling
      - Vegetative
      - Flowering
      - Fruiting
      - Mature_Harvest
      - Senescing

split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42

quality:
  min_image_size: 64
  max_image_size: 2048
  allowed_formats: [".jpg", ".jpeg", ".png", ".webp"]
  corrupt_threshold: 0.01

deduplication:
  method: "phash"
  hash_size: 8
  similarity_threshold: 5
  prevent_leakage: true

augmentation:
  random_flip: true
  random_rotation: 15
  random_brightness: 0.1
  random_contrast: 0.1
  random_saturation: 0.1

model:
  base_model: "mobilenet_v3_small"
  input_size: 224
  batch_size: 32
  epochs: 10
  learning_rate: 0.001
  optimizer: "adam"
