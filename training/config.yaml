data:
  raw_dir: "../data/raw"
  processed_dir: "../data/processed"
  manifests_dir: "../data/manifests"
  reports_dir: "../data/reports"

target_classes:
  - Tomato
  - Pepper_sweet
  - Pepper_hot
  - Cucumber
  - Bean
  - Carrot
  - Corn
  - Onion
  - Potato
  - Broccoli
  - Cabbage
  - Lettuce
  - Spinach
  - Pea
  - Radish
  - Summer_squash
  - Winter_squash
  - Strawberry
  - Watermelon
  - Cantaloupe
  - Pumpkin
  - Beet
  - Turnip
  - Sweet_potato
  - Basil
  - Cilantro
  - Parsley
  - Dill
  - Chives
  - Rosemary
  - Thyme
  - Oregano
  - Sage
  - Blueberry
  - Grape
  - Marigold
  - Zinnia
  - Nasturtium
  - Sunflower
  - Cosmos
  - Petunia
  - Begonia
  - Eggplant
  - Okra
  - Asparagus
  - Rhubarb
  - Celery
  - Leek
  - Fennel
  - Artichoke

split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42

quality:
  min_image_size: 64
  max_image_size: 2048
  allowed_formats: [".jpg", ".jpeg", ".png", ".webp"]
  corrupt_threshold: 0.01

deduplication:
  method: "phash"
  hash_size: 8
  similarity_threshold: 5
  prevent_leakage: true

augmentation:
  random_flip: true
  random_rotation: 15
  random_brightness: 0.1
  random_contrast: 0.1
  random_saturation: 0.1

model:
  base_model: "mobilenet_v2"
  input_size: 224
  batch_size: 32
  epochs: 10
  learning_rate: 0.001
  optimizer: "adam"
