      - Pea
      - Radish
      - Summer_squash
      - Winter_squash
      - Watermelon
      - Cantaloupe
      - Pumpkin
      - Beet
      - Turnip
      - Sweet_potato
      - Basil
      - Cilantro
      - Parsley
      - Dill
      - Chives
      - Rosemary
      - Thyme
      - Oregano
      - Sage
      - Strawberry
      - Blueberry
      - Grape
      - Marigold
      - Zinnia
      - Nasturtium
      - Sunflower
      - Cosmos
      - Petunia
      - Begonia
      - Eggplant
      - Okra
      - Asparagus
      - Rhubarb
      - Celery
      - Leek
      - Fennel
      - Artichoke

  weeds:
